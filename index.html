<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL OS v3.0 // ULTIMATE EDITION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --main-color: #ffb000;
            --bg-color: #030201;
            --card-bg: #050401;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: 'VT323', monospace;
            font-size: 22px;
            letter-spacing: 1px;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: crosshair;
            transition: color 0.3s, background-color 0.3s;
        }

        /* 1. CRT экран и сканирование */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(0,0,0,0) 20%, rgba(0,0,0,0.85) 80%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.6) 50%);
            background-size: 100% 100%, 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        /* 2. Мерцание */
        .flicker { animation: crtFlicker 0.15s infinite; }
        @keyframes crtFlicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        /* 3. Окно терминала */
        .terminal {
            max-width: 820px;
            width: 100%;
            border: 2px solid var(--main-color);
            padding: 25px;
            background-color: #000000;
            box-shadow: 0 0 25px rgba(255, 176, 0, 0.2), inset 0 0 20px rgba(255, 176, 0, 0.1);
            position: relative;
            z-index: 1;
            transition: transform 0.05s ease-out;
        }

        /* 4. Верхняя панель */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--main-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            cursor: move; /* Перетаскивание */
        }

        .controls-btn {
            background: var(--main-color);
            color: #000;
            border: none;
            font-family: 'VT323', monospace;
            font-size: 0.9rem;
            padding: 2px 6px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 4px;
        }

        .controls-btn:hover { background: #fff; box-shadow: 0 0 10px #fff; }

        /* 5. Следящее око */
        .eye-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .eye {
            width: 30px; height: 18px;
            border: 2px solid var(--main-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pupil {
            width: 8px; height: 8px;
            background: var(--main-color);
            border-radius: 50%;
            transition: transform 0.1s ease;
        }

        /* 6. Проекты */
        .project-list { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; }
        .project-card {
            border: 1px dashed var(--main-color);
            padding: 12px;
            background-color: var(--card-bg);
            display: flex; gap: 15px; align-items: center;
            transition: all 0.2s;
        }
        .project-card:hover {
            border-style: solid;
            box-shadow: 0 0 15px rgba(255, 176, 0, 0.3);
            transform: translateX(5px);
        }
        .project-thumb {
            width: 120px; height: 80px; object-fit: cover;
            border: 1px solid var(--main-color);
            filter: grayscale(100%) sepia(100%);
        }
        .project-card:hover .project-thumb { filter: none; }

        /* 7. Консоль */
        .console-box { border: 1px solid var(--main-color); background: #000; padding: 12px; }
        .console-logs { max-height: 100px; overflow-y: auto; font-size: 1rem; margin-bottom: 8px; }
        .console-input-row { display: flex; gap: 8px; }
        .console-input {
            background: transparent; border: none; color: var(--main-color);
            font-family: 'VT323', monospace; font-size: 1.2rem; width: 100%; outline: none;
        }

        .retro-btn {
            color: #000; background: var(--main-color);
            text-decoration: none; padding: 2px 8px; font-weight: bold;
            display: inline-block; margin-top: 5px;
        }
        .retro-btn:hover { background: #fff; box-shadow: 0 0 10px #fff; }

        /* Эффект жесткого глитча */
        .glitch-active {
            animation: hardGlitch 0.2s infinite;
        }
        @keyframes hardGlitch {
            0% { transform: translate(5px, -5px) skew(10deg); filter: invert(1); }
            50% { transform: translate(-5px, 5px) skew(-10deg); }
            100% { transform: translate(0); filter: none; }
        }
    </style>
</head>
<body class="flicker">

    <div class="crt-overlay" id="crt"></div>

    <main class="terminal" id="terminal">
        
        <div class="top-bar" id="drag-handle">
            <div class="eye-container">
                <div class="eye"><div class="pupil" id="pupil"></div></div>
                <span>CORE_OS v3.0</span>
            </div>
            <div>
                <button class="controls-btn" onclick="toggleNoise()">NOISE</button>
                <button class="controls-btn" onclick="toggleRedAlert()">ALARM</button>
                <button class="controls-btn" onclick="triggerGlitch()">GLITCH</button>
                <button class="controls-btn" onclick="toggleMute()">MUTE</button>
            </div>
        </div>

        <header>
            <h1 style="font-size: 2.8rem; text-shadow: 0 0 10px var(--main-color);">ANALOG_MONSTER</h1>
            <p style="opacity: 0.7;">[STATUS: ACTIVE] // USER_ID: UNKNOWN</p>
        </header>

        <section class="project-list">
            <div class="project-card" onmouseenter="playHover()">
                <img src="https://via.placeholder.com/300x200/221100/ffb000?text=GAME_01" class="project-thumb">
                <div>
                    <h3>PROJECT // BUCKSHOT_ROULETTE_STYLE</h3>
                    <p>Эксперимент с атмосферой и аналоговым звуком.</p>
                    <a href="#" class="retro-btn" onclick="playClick()">[ ЗАПУСК ]</a>
                </div>
            </div>
        </div>

        <section class="console-box">
            <div class="console-logs" id="logs">
                <p>> Система готова. Команды: 'help', 'clear', 'alarm', 'noise'.</p>
            </div>
            <div class="console-input-row">
                <span>></span>
                <input type="text" id="cli" class="console-input" placeholder="введи команду..." autocomplete="off">
            </div>
        </section>

    </main>

    <script>
        // --- 1. Аудио система ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = false;
        let noiseNode = null;

        function playClick() {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        }

        function playHover() {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.02);
        }

        function toggleMute() {
            isMuted = !isMuted;
            alert(isMuted ? 'Звук отключен' : 'Звук включен');
        }

        // --- 2. Генератор радио-шума (White Noise) ---
        function toggleNoise() {
            playClick();
            if (noiseNode) {
                noiseNode.stop();
                noiseNode = null;
            } else {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;
                const gain = audioCtx.createGain();
                gain.gain.value = 0.03; // Негромко
                noiseNode.connect(gain);
                gain.connect(audioCtx.destination);
                noiseNode.start();
            }
        }

        // --- 3. Следящий глаз и свет фонарика ---
        document.addEventListener('mousemove', (e) => {
            // Фонарик
            document.documentElement.style.setProperty('--mouse-x', e.clientX + 'px');
            document.documentElement.style.setProperty('--mouse-y', e.clientY + 'px');

            // Зрачок
            const pupil = document.getElementById('pupil');
            const eye = pupil.getBoundingClientRect();
            const x = (e.clientX - eye.left) / 100;
            const y = (e.clientY - eye.top) / 100;
            pupil.style.transform = `translate(${Math.max(-5, Math.min(5, x))}px, ${Math.max(-3, Math.min(3, y))}px)`;
        });

        // --- 4. Режим Красной Тревоги ---
        let redAlert = false;
        function toggleRedAlert() {
            playClick();
            redAlert = !redAlert;
            document.documentElement.style.setProperty('--main-color', redAlert ? '#ff0033' : '#ffb000');
            document.documentElement.style.setProperty('--bg-color', redAlert ? '#0a0002' : '#030201');
        }

        // --- 5. Мгновенный глитч-шок ---
        function triggerGlitch() {
            playClick();
            const term = document.getElementById('terminal');
            term.classList.add('glitch-active');
            setTimeout(() => term.classList.remove('glitch-active'), 500);
        }

        // --- 6. Консоль с историей команд и звуком печати ---
        const cli = document.getElementById('cli');
        const logs = document.getElementById('logs');
        let cmdHistory = [];
        let historyIndex = -1;

        cli.addEventListener('keydown', (e) => {
            playHover(); // Звук клавиатуры
            if (e.key === 'Enter') {
                playClick();
                const val = cli.value.trim();
                if (!val) return;

                cmdHistory.push(val);
                historyIndex = cmdHistory.length;

                const p = document.createElement('p');
                p.textContent = '> ' + val;
                logs.appendChild(p);

                const cmd = val.toLowerCase();
                cli.value = '';

                const reply = document.createElement('p');
                reply.style.color = '#fff';

                if (cmd === 'help') reply.textContent = 'Команды: help, clear, alarm, noise, glitch';
                else if (cmd === 'clear') { logs.innerHTML = ''; return; }
                else if (cmd === 'alarm') { toggleRedAlert(); reply.textContent = 'Режим тревоги переключен.'; }
                else if (cmd === 'noise') { toggleNoise(); reply.textContent = 'Радиошум переключен.'; }
                else if (cmd === 'glitch') { triggerGlitch(); reply.textContent = 'Сбой спровоцирован.'; }
                else reply.textContent = 'Неизвестный протокол.';

                logs.appendChild(reply);
                logs.scrollTop = logs.scrollHeight;
            } else if (e.key === 'ArrowUp') {
                if (historyIndex > 0) { historyIndex--; cli.value = cmdHistory[historyIndex]; }
            } else if (e.key === 'ArrowDown') {
                if (historyIndex < cmdHistory.length - 1) { historyIndex++; cli.value = cmdHistory[historyIndex]; }
                else { historyIndex = cmdHistory.length; cli.value = ''; }
            }
        });

        // --- 7. Перетаскивание окна (Drag and Drop) ---
        const dragHandle = document.getElementById('drag-handle');
        const terminal = document.getElementById('terminal');
        let isDragging = false, startX, startY, initialX, initialY;

        dragHandle.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            const rect = terminal.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            terminal.style.position = 'absolute';
            terminal.style.left = `${initialX + dx}px`;
            terminal.style.top = `${initialY + dy}px`;
        });

        document.addEventListener('mouseup', () => isDragging = false);

        // --- 8. Случайные сообщения от системы ---
        setInterval(() => {
            if (Math.random() > 0.7) {
                const p = document.createElement('p');
                p.style.opacity = '0.5';
                p.style.fontSize = '0.8rem';
                p.textContent = `[SYS_LOG_${Math.floor(Math.random()*900+100)}]: SCANNING PORT ${Math.floor(Math.random()*8000)}... OK`;
                logs.appendChild(p);
                logs.scrollTop = logs.scrollHeight;
            }
        }, 12000);
    </script>
</body>
</html>
