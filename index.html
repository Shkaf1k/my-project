<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Проект — Вонксель Редактор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="container">
        <h1>МойПроект</h1>
        <p class="subtitle">Бесплатный 8-битный воксельный редактор и рендер</p>
    </header>

    <main class="container">
        <!-- Секция скачивания -->
        <section class="download-box">
            <h2>Скачать</h2>
            <div class="buttons">
                <a href="#" class="btn">Win 64-bit</a>
                <a href="#" class="btn">macOS</a>
            </div>
            <p class="version-info">Версия 0.99.7 — Обновлено: 2026</p>
        </section>

        <!-- Секция скриншотов / галереи -->
        <section class="gallery">
            <h2>Галерея</h2>
            <div class="grid">
                <div class="card"><img src="https://via.placeholder.com/300x200" alt="Превью 1"><p>Описание 1</p></div>
                <div class="card"><img src="https://via.placeholder.com/300x200" alt="Превью 2"><p>Описание 2</p></div>
            </div>
        </section>

        <!-- Секция ссылок / соцсетей -->
        <section class="links">
            <h2>Ссылки и Связь</h2>
            <ul>
                <li><a href="#">Twitter / X</a></li>
                <li><a href="#">GitHub Repository</a></li>
                <li><a href="#">Документация / Туториалы</a></li>
            </ul>
        </section>
    </main>

    <footer class="container">
        <p>© 2026 МойПроект. Создано с помощью HTML & CSS.</p>
    </footer>

</body>
</html>
