<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обсуждение темы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Форум</h1>
        <a href="index.html" style="color: #fff;">← На главную</a>
    </header>

    <main class="container">
        <article class="topic-card">
            <h2>Тема обсуждения</h2>
            <p>Оставляйте свои комментарии ниже. Авторизация происходит через ваш аккаунт GitHub.</p>
        </article>

        <!-- Блок комментариев Giscus -->
        <div class="comments-section">
            <script src="https://giscus.app/client.js"
                    data-repo="ТВОЙ_GITHUB_USERNAME/ТВОЙ_РЕПОЗИТОРИЙ"
                    data-repo-id="ТВОЙ_REPO_ID"
                    data-category="Announcements"
                    data-category-id="ТВОЙ_CATEGORY_ID"
                    data-mapping="pathname"
                    data-strict="0"
                    data-reactions-enabled="1"
                    data-emit-metadata="0"
                    data-input-position="bottom"
                    data-theme="light"
                    data-lang="ru"
                    crossorigin="anonymous"
                    async>
            </script>
        </div>
    </main>
</body>
</html>
